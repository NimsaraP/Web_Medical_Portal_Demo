spring.application.name=webmedicalportal

# Database Configuration
# Replace with your MySQL credentials or set environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/webmedicalportal
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password_here}

# This helps Spring Boot communicate with MySQL specifically
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# This shows the SQL in your console (very helpful for debugging!)
spring.jpa.show-sql=true

# Tell Spring where JSPs are and what their "endings" are
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# AI Configuration
# Google Gemini Configuration
# Point the OpenAI-starter at Gemini's OpenAI-compatible endpoint
spring.ai.openai.api-key=${GEMINI_API_KEY:your_api_key_here}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-3.5-flash-lite